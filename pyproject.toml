[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multiagent-safejudge"
version = "0.1.0"
description = "Reproducible multi-agent safety evaluation for multimodal language models"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "MultiAgent-SafeJudge contributors" }]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]
orchestration = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]

[project.scripts]
safejudge = "safejudge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/safejudge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["safejudge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
