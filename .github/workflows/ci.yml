name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,orchestration]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
